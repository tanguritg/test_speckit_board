<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Complaint Board with AI Auto-response</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <header>
            <h1>고객 컴플레인 게시판</h1>
            <p>고객님의 소중한 의견을 들려주세요. AI가 빠르게 답변해 드립니다.</p>
        </header>
        
        <main>
            <section id="form-section" class="card">
                <h2>새 컴플레인 작성</h2>
                <form id="complaint-form">
                    <div class="form-group">
                        <label for="author">성함/이메일</label>
                        <input type="text" id="author" placeholder="작성자 정보를 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="title">제목</label>
                        <input type="text" id="title" placeholder="무엇이 불편하신가요?" required>
                    </div>
                    <div class="form-group">
                        <label for="content">내용</label>
                        <textarea id="content" rows="5" placeholder="상세한 내용을 입력해 주세요" required></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary">컴플레인 등록</button>
                </form>
                <div id="processing-status" class="hidden">
                    <p class="status-message">AI가 답변을 생성 중입니다. 잠시만 기다려 주세요...</p>
                    <div class="spinner"></div>
                </div>
            </section>
            
            <section id="board-section">
                <h2>전체 컴플레인 내역</h2>
                <div id="board-container"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
